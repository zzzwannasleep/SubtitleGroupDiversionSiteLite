server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名

    # 日志
    access_log /var/log/nginx/rss-torrent-access.log;
    error_log /var/log/nginx/rss-torrent-error.log;

    # 上传文件大小限制
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件（可选，提高性能）
    location /static {
        alias /var/www/rss-torrent-site/static;
        expires 30d;
    }

    # 上传文件
    location /uploads {
        alias /var/www/rss-torrent-site/uploads;
    }
}
