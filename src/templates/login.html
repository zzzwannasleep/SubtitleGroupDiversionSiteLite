{% extends "base.html" %}

{% block title %}登录 - RSS种子站点{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <div class="card-header">
        <h2>🔐 用户登录</h2>
    </div>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" required placeholder="输入用户名">
        </div>
        
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" class="form-control" required placeholder="输入密码">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px;">
        还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
    </p>
</div>
{% endblock %}
